<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面没找到 — Zenith AI 研学社</title>
<meta name="robots" content="noindex">
<style>
  :root{--purple:#8B5CF6;--purple-deep:#7C3AED;--bg:#F7F5FC;--text:#3E3A52;--soft:#6B6480}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:linear-gradient(180deg,#F7F5FC,#EFEBF9);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       text-align:center;padding:2rem}
  .box{max-width:520px}
  .mark{font-size:2.4rem;color:var(--purple);line-height:1}
  .code{font-size:clamp(3.4rem,14vw,5.6rem);font-weight:700;color:var(--purple-deep);
        margin:.6rem 0 .2rem;letter-spacing:.04em}
  h1{font-size:1.35rem;margin:.2rem 0 1rem;font-weight:700}
  p{color:var(--soft);line-height:1.9;margin:0 0 2rem}
  .btn{display:inline-block;padding:.85rem 2rem;border-radius:12px;text-decoration:none;
       color:#fff;background:linear-gradient(120deg,#8B5CF6,#7C3AED);
       box-shadow:0 6px 24px rgba(139,92,246,.28);font-weight:600}
  .motto{margin-top:2.4rem;font-size:.9rem;color:#8F88A8}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">▲</div>
    <div class="code">404</div>
    <h1>这条路没走到山顶</h1>
    <p>你要找的页面不在了，或者链接敲错了一个字。<br>回主页，我们继续聊 AI 落地。</p>
    <a class="btn" href="/zenithweb/">回到首页</a>
    <p class="motto">向下扎根，向上破界。山顶见。</p>
  </div>
</body>
</html>
